name: flutter_v2ray_client
description: Android-first Flutter plugin for embedded Xray VPN and proxy modes.

topics:
  - vpn
  - v2ray
  - xray
  - proxy

version: 3.4.0
homepage: https://github.com/zikwall/flutter_xray
repository: https://github.com/zikwall/flutter_xray
issue_tracker: https://github.com/zikwall/flutter_xray/issues

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.amirzr.flutter_v2ray_client
        pluginClass: FlutterV2rayPlugin
      ios:
        pluginClass: FlutterV2rayPlugin
