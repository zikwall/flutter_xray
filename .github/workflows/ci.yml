name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
        working-directory: example
      - run: ./gradlew testDebugUnitTest
        working-directory: example/android
      - run: >-
          ./tool/verify_android_16k.sh
          example/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
