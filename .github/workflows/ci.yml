name: CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - analysis_options.yaml
      - pubspec.yaml
      - lib/**
      - test/**
      - android/**
      - example/analysis_options.yaml
      - example/pubspec.yaml
      - example/lib/**
      - example/android/**
      - tool/verify_android_16k.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - analysis_options.yaml
      - pubspec.yaml
      - lib/**
      - test/**
      - android/**
      - example/analysis_options.yaml
      - example/pubspec.yaml
      - example/lib/**
      - example/android/**
      - tool/verify_android_16k.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
        working-directory: example
      - run: ./gradlew testDebugUnitTest
        working-directory: example/android
      - run: >-
          ./tool/verify_android_16k.sh
          example/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
