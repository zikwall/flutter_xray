name: Native Android build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - .github/workflows/native-build.yml
      - native/**
      - tool/native/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Load locked toolchain versions
        run: |
          source tool/native/versions.env
          echo "GO_VERSION=$GO_VERSION" >>"$GITHUB_ENV"
          echo "JAVA_VERSION=$JAVA_VERSION" >>"$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION" >>"$GITHUB_ENV"
          echo "ANDROID_COMPILE_SDK=$ANDROID_COMPILE_SDK" >>"$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >>"$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/AndroidLibXrayLite/go.sum
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install locked Android toolchain
        run: |
          sdkmanager --install \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK_VERSION"
      - name: Verify pinned inputs
        run: ./tool/native/check_inputs.sh
      - name: Build and verify native artifacts
        run: ./tool/native/build_android.sh all
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Compile plugin with generated Xray AAR
        run: |
          ./tool/native/install_xray_android.sh
          ./tool/native/install_hev_android.sh
          flutter pub get
          (cd example && flutter pub get)
          (cd example/android && ./gradlew testDebugUnitTest)
      - name: Package and verify generated Xray AAR
        run: |
          (cd example && flutter build apk --release --split-per-abi --target-platform android-arm64)
          ./tool/verify_android_16k.sh \
            example/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: flutter-xray-native-android
          path: native-build/android
          if-no-files-found: error
          retention-days: 14
