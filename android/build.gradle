group 'dev.zikwall.flutter_xray'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'dev.zikwall.flutter_xray'
    }

    compileSdkVersion 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        // The embedded AndroidLibXrayLite AAR and locked native toolchain both
        // target API 24. Advertising a lower plugin minimum is misleading and
        // can defer an incompatibility until application packaging/runtime.
        minSdkVersion 24
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:5.20.0'
        testImplementation 'org.json:json:20250517'
    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}


dependencies {
    implementation(name: "libv2ray", ext: "aar")
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

rootProject.allprojects {
    repositories {
        flatDir {
            // Ensure Gradle looks for libv2ray.aar inside this plugin's libs folder
            dirs project(':flutter_xray').file('libs')
        }
    }
}
